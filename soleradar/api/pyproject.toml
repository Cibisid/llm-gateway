[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soleradar"
version = "0.1.0"
description = "Sneaker release radar: what is dropping, what is hot, and why."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
soleradar = "soleradar.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soleradar*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
